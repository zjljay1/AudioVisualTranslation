<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
    .switch-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn { width: 100%; padding: 10px; background: #0078D4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #005A9E; }
    .btn.danger { background: #D13438; }
    .btn.danger:hover { background: #A80000; }
    select, input { width: 100%; margin-top: 5px; margin-bottom: 15px; padding: 5px; }
  </style>
</head>
<body>
  <h3>实时翻译控制台</h3>
  
  <div class="switch-container">
    <label>源语言:</label>
    <select id="sourceLang">
      <option value="auto">自动识别</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <div class="switch-container">
    <label>目标语言:</label>
    <select id="targetLang">
      <option value="zh" selected>中文</option>
      <option value="en">英语</option>
    </select>
  </div>

  <button id="startBtn" class="btn">开始捕获并翻译</button>
  <button id="stopBtn" class="btn danger" style="display: none; margin-top: 10px;">停止</button>

  <script src="popup.js"></script>
</body>
</html>
